<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Schema Artifact Generator</title>
		<style>
			:root {
				color-scheme: light;
				font-family:
					Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
					"Segoe UI", sans-serif;
				background: #f6f7f9;
				color: #18202a;
			}

			* {
				box-sizing: border-box;
			}

			body {
				margin: 0;
				min-height: 100vh;
			}

			main {
				width: min(1220px, calc(100vw - 32px));
				margin: 0 auto;
				padding: 32px 0;
			}

			header {
				margin-bottom: 20px;
			}

			h1 {
				margin: 0 0 6px;
				font-size: 28px;
				line-height: 1.2;
				font-weight: 720;
			}

			p {
				margin: 0;
				color: #526170;
				line-height: 1.5;
			}

			.panel {
				background: #ffffff;
				border: 1px solid #dde3ea;
				border-radius: 8px;
				box-shadow: 0 18px 45px rgba(24, 32, 42, 0.07);
				overflow: hidden;
			}

			form {
				display: grid;
				gap: 14px;
				padding: 18px;
			}

			label {
				display: grid;
				gap: 7px;
				font-size: 13px;
				font-weight: 650;
				color: #263341;
			}

			textarea {
				width: 100%;
				min-height: 360px;
				resize: vertical;
				border: 1px solid #c8d2dc;
				border-radius: 6px;
				padding: 12px;
				font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
				color: #18202a;
				background: #ffffff;
			}

			textarea:focus {
				outline: 3px solid #b7d9ff;
				border-color: #2b73c5;
			}

			button {
				height: 40px;
				border: 0;
				border-radius: 6px;
				padding: 0 16px;
				font: inherit;
				font-weight: 700;
				color: #ffffff;
				background: #245ea8;
				cursor: pointer;
			}

			button.secondary {
				color: #1d2a38;
				background: #e8edf2;
			}

			button:disabled {
				cursor: not-allowed;
				opacity: 0.62;
			}

			.status {
				display: flex;
				align-items: center;
				justify-content: space-between;
				gap: 16px;
				padding: 12px 18px;
				border-top: 1px solid #dde3ea;
				color: #526170;
				font-size: 13px;
			}

			.artifact-grid {
				display: grid;
				grid-template-columns: repeat(2, minmax(0, 1fr));
				gap: 18px;
				margin-top: 18px;
				align-items: start;
			}

			.output-head {
				display: flex;
				align-items: center;
				justify-content: space-between;
				gap: 16px;
				padding: 14px 18px;
				border-bottom: 1px solid #dde3ea;
			}

			.output-head strong {
				font-size: 14px;
			}

			.actions {
				display: flex;
				gap: 8px;
				flex-wrap: wrap;
			}

			pre {
				margin: 0;
				min-height: 560px;
				max-height: 70vh;
				overflow: auto;
				padding: 18px;
				background: #101820;
				color: #d7e2ee;
				font: 13px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
				tab-size: 2;
				white-space: pre;
			}

			.error {
				color: #b42318;
			}

			@media (max-width: 900px) {
				.status,
				.artifact-grid,
				.output-head {
					display: grid;
					grid-template-columns: 1fr;
				}

				button {
					width: 100%;
				}
			}
		</style>
	</head>
	<body>
		<main>
			<header>
				<h1>Schema Artifact Generator</h1>
				<p>
					Paste a generated Dataverse schema JSON and generate the matching
					model and service TypeScript files.
				</p>
			</header>

			<section class="panel">
				<form id="artifactForm">
					<label>
						Generated schema JSON
						<textarea
							id="schemaJson"
							required
							placeholder="Paste the full generated schema JSON here."
						></textarea>
					</label>
					<button id="generateButton" type="submit">Generate Files</button>
				</form>
				<div class="status">
					<span id="statusText">Ready</span>
					<span id="summaryText">No files generated yet.</span>
				</div>
			</section>

			<section class="artifact-grid">
				<div class="panel">
					<div class="output-head">
						<strong id="modelTitle">Generated model</strong>
						<div class="actions">
							<button id="copyModelButton" class="secondary" type="button" disabled>
								Copy Model
							</button>
							<button
								id="downloadModelButton"
								class="secondary"
								type="button"
								disabled
							>
								Download Model
							</button>
						</div>
					</div>
					<pre id="modelOutput">// Paste schema JSON and generate files.</pre>
				</div>

				<div class="panel">
					<div class="output-head">
						<strong id="serviceTitle">Generated service</strong>
						<div class="actions">
							<button id="copyServiceButton" class="secondary" type="button" disabled>
								Copy Service
							</button>
							<button
								id="downloadServiceButton"
								class="secondary"
								type="button"
								disabled
							>
								Download Service
							</button>
						</div>
					</div>
					<pre id="serviceOutput">// Paste schema JSON and generate files.</pre>
				</div>
			</section>
		</main>

		<script>
			const form = document.querySelector("#artifactForm");
			const schemaJson = document.querySelector("#schemaJson");
			const generateButton = document.querySelector("#generateButton");
			const statusText = document.querySelector("#statusText");
			const summaryText = document.querySelector("#summaryText");
			const modelTitle = document.querySelector("#modelTitle");
			const serviceTitle = document.querySelector("#serviceTitle");
			const modelOutput = document.querySelector("#modelOutput");
			const serviceOutput = document.querySelector("#serviceOutput");
			const copyModelButton = document.querySelector("#copyModelButton");
			const downloadModelButton = document.querySelector("#downloadModelButton");
			const copyServiceButton = document.querySelector("#copyServiceButton");
			const downloadServiceButton = document.querySelector("#downloadServiceButton");

			let generatedModel = "";
			let generatedService = "";
			let generatedModelFileName = "Model.ts";
			let generatedServiceFileName = "Service.ts";

			form.addEventListener("submit", (event) => {
				event.preventDefault();
				setBusy(true);

				try {
					const schema = parseSchema(schemaJson.value);
					const artifacts = generateTypeScriptArtifacts(schema);
					generatedModel = artifacts.model;
					generatedService = artifacts.service;
					generatedModelFileName = `${artifacts.typeName}Model.ts`;
					generatedServiceFileName = `${artifacts.typeName}Service.ts`;

					modelOutput.classList.remove("error");
					serviceOutput.classList.remove("error");
					modelOutput.textContent = generatedModel;
					serviceOutput.textContent = generatedService;
					modelTitle.textContent = generatedModelFileName;
					serviceTitle.textContent = generatedServiceFileName;

					copyModelButton.disabled = false;
					downloadModelButton.disabled = false;
					copyServiceButton.disabled = false;
					downloadServiceButton.disabled = false;

					const propertyCount = Object.keys(
						schema.schema.items.properties || {},
					).length;
					statusText.textContent = "Files generated.";
					summaryText.textContent = `${propertyCount} schema properties processed.`;
				} catch (error) {
					const message =
						error instanceof Error ? error.message : "Unknown error occurred.";
					generatedModel = "";
					generatedService = "";
					modelOutput.classList.add("error");
					serviceOutput.classList.add("error");
					modelOutput.textContent = message;
					serviceOutput.textContent = message;
					copyModelButton.disabled = true;
					downloadModelButton.disabled = true;
					copyServiceButton.disabled = true;
					downloadServiceButton.disabled = true;
					statusText.textContent = "Generation failed.";
					summaryText.textContent = "Fix the pasted JSON and submit again.";
				} finally {
					setBusy(false);
				}
			});

			copyModelButton.addEventListener("click", async () => {
				if (!generatedModel) return;
				await navigator.clipboard.writeText(generatedModel);
				statusText.textContent = "Model copied.";
			});

			downloadModelButton.addEventListener("click", () => {
				if (!generatedModel) return;
				downloadText(generatedModel, generatedModelFileName, "text/typescript");
				statusText.textContent = "Model download started.";
			});

			copyServiceButton.addEventListener("click", async () => {
				if (!generatedService) return;
				await navigator.clipboard.writeText(generatedService);
				statusText.textContent = "Service copied.";
			});

			downloadServiceButton.addEventListener("click", () => {
				if (!generatedService) return;
				downloadText(generatedService, generatedServiceFileName, "text/typescript");
				statusText.textContent = "Service download started.";
			});

			function parseSchema(rawValue) {
				const trimmed = rawValue.trim();
				if (!trimmed) throw new Error("Schema JSON is required.");

				let schema;
				try {
					schema = JSON.parse(trimmed);
				} catch (error) {
					const message = error instanceof Error ? error.message : "Invalid JSON";
					throw new Error(`Schema JSON is not valid JSON: ${message}`);
				}

				if (!schema?.schema?.items?.properties) {
					throw new Error(
						"Schema JSON must include schema.items.properties from the generated Dataverse schema.",
					);
				}

				return schema;
			}

			function generateTypeScriptArtifacts(schema) {
				const items = schema.schema.items;
				const properties = items.properties || {};
				const required = new Set(items.required || []);
				const entitySetName =
					items["x-ms-dataverse-entityset"] || `${schema.name || "Entity"}s`;
				const primaryId = items["x-ms-dataverse-primary-id"];
				if (!primaryId) {
					throw new Error(
						'Schema JSON must include schema.items["x-ms-dataverse-primary-id"].',
					);
				}

				const typeName = toTypeName(entitySetName);
				const enumProperties = Object.entries(properties).filter(([, property]) =>
					Array.isArray(property.enum),
				);
				const baseProperties = Object.entries(properties).filter(([, property]) =>
					isBaseProperty(property),
				);
				const readProperties = Object.entries(properties).filter(
					([, property]) => !isBaseProperty(property) && !isLookupProperty(property),
				);
				const lookupProperties = Object.entries(properties).filter(([, property]) =>
					isLookupProperty(property),
				);

				return {
					typeName,
					model: generateModelFile({
						typeName,
						enumProperties,
						baseProperties,
						readProperties,
						lookupProperties,
						required,
					}),
					service: generateServiceFile({ typeName, entitySetName, primaryId }),
				};
			}

			function generateModelFile({
				typeName,
				enumProperties,
				baseProperties,
				readProperties,
				lookupProperties,
				required,
			}) {
				const lines = [headerComment()];

				for (const [name, property] of enumProperties) {
					const enumName = `${typeName}${name}`;
					lines.push(`export const ${enumName} = {`);
					const values = property["x-ms-enum-values"] || [];
					const labels = property.enum || [];
					for (let index = 0; index < values.length; index += 1) {
						const comma = index === values.length - 1 ? "" : ",";
						lines.push(
							`  ${formatObjectKey(values[index])}: '${escapeSingleQuote(
								labels[index] ?? String(values[index]),
							)}'${comma}`,
						);
					}
					lines.push(`} as const;`);
					lines.push(`export type ${enumName} = keyof typeof ${enumName};`);
				}

				if (enumProperties.length > 0) lines.push("");

				lines.push(`export interface ${typeName}Base {`);
				for (const [name, property] of baseProperties) {
					lines.push(
						`  ${name}${required.has(name) || property.required ? "" : "?"}: ${toTsType(
							name,
							property,
							typeName,
						)};`,
					);
				}
				lines.push("}");
				lines.push("");
				lines.push(`export interface ${typeName} extends ${typeName}Base {`);
				for (const [name, property] of readProperties) {
					lines.push(
						`  ${name}${required.has(name) || property.required ? "" : "?"}: ${toTsType(
							name,
							property,
							typeName,
						)};`,
					);
				}
				for (const [name] of lookupProperties) {
					lines.push(`  ${name}?: object;`);
					lines.push(`  _${name}_value?: string;`);
				}
				lines.push("}");

				return `${lines.join("\n")}\n`;
			}

			function generateServiceFile({ typeName, entitySetName, primaryId }) {
				return `${headerComment()}

import type { IOperationResult } from "@microsoft/power-apps/data";
import { getClient } from "@microsoft/power-apps/data";
import type {
\tEntityMetadata,
\tGetEntityMetadataOptions,
} from "@microsoft/power-apps/data/metadata/dataverse";
import { dataSourcesInfo } from "../../../.power/schemas/appschemas/dataSourcesInfo";
import type { IGetAllOptions, IGetOptions } from "../models/CommonModels";
import type { ${typeName}, ${typeName}Base } from "../models/${typeName}Model";

//biome-ignore lint/complexity/noStaticOnlyClass: <wip
export class ${typeName}Service {
\tprivate static readonly dataSourceName = "${entitySetName}";

\tprivate static readonly client = getClient(dataSourcesInfo);

\tpublic static async create(
\t\trecord: Omit<${typeName}Base, "${primaryId}">,
\t): Promise<IOperationResult<${typeName}>> {
\t\tconst result = await ${typeName}Service.client.createRecordAsync<
\t\t\tOmit<${typeName}Base, "${primaryId}">,
\t\t\t${typeName}
\t\t>(${typeName}Service.dataSourceName, record);
\t\treturn result;
\t}

\tpublic static async update(
\t\tid: string,
\t\tchangedFields: Partial<Omit<${typeName}Base, "${primaryId}">>,
\t): Promise<IOperationResult<${typeName}>> {
\t\tconst result = await ${typeName}Service.client.updateRecordAsync<
\t\t\tPartial<Omit<${typeName}Base, "${primaryId}">>,
\t\t\t${typeName}
\t\t>(${typeName}Service.dataSourceName, id, changedFields);
\t\treturn result;
\t}

\tpublic static async delete(id: string): Promise<void> {
\t\tawait ${typeName}Service.client.deleteRecordAsync(
\t\t\t${typeName}Service.dataSourceName,
\t\t\tid,
\t\t);
\t}

\tpublic static async get(
\t\tid: string,
\t\toptions?: IGetOptions,
\t): Promise<IOperationResult<${typeName}>> {
\t\tconst result =
\t\t\tawait ${typeName}Service.client.retrieveRecordAsync<${typeName}>(
\t\t\t\t${typeName}Service.dataSourceName,
\t\t\t\tid,
\t\t\t\toptions,
\t\t\t);
\t\treturn result;
\t}

\tpublic static async getAll(
\t\toptions?: IGetAllOptions,
\t): Promise<IOperationResult<${typeName}[]>> {
\t\tconst result =
\t\t\tawait ${typeName}Service.client.retrieveMultipleRecordsAsync<${typeName}>(
\t\t\t\t${typeName}Service.dataSourceName,
\t\t\t\toptions,
\t\t\t);
\t\treturn result;
\t}

\tpublic static getMetadata(
\t\toptions: GetEntityMetadataOptions<${typeName}> = {},
\t): Promise<IOperationResult<Partial<EntityMetadata>>> {
\t\treturn ${typeName}Service.client.executeAsync({
\t\t\tdataverseRequest: {
\t\t\t\taction: "getEntityMetadata",
\t\t\t\tparameters: {
\t\t\t\t\ttableName: ${typeName}Service.dataSourceName,
\t\t\t\t\toptions: options as GetEntityMetadataOptions,
\t\t\t\t},
\t\t\t},
\t\t});
\t}
}
`;
			}

			function isBaseProperty(property) {
				return !property["x-ms-read-only"] && !isLookupProperty(property);
			}

			function isLookupProperty(property) {
				return property["x-ms-dataverse-type"] === "LookupType";
			}

			function toTsType(name, property, typeName) {
				if (Array.isArray(property.enum)) return `${typeName}${name}`;

				switch (property["x-ms-dataverse-type"]) {
					case "BigIntType":
					case "DecimalType":
					case "DoubleType":
					case "IntegerType":
					case "MoneyType":
						return "number";
					case "BooleanType":
						return "boolean";
					default:
						return "string";
				}
			}

			function toTypeName(value) {
				const safeValue = String(value || "Entity").replace(/[^a-zA-Z0-9_]/g, "_");
				return `${safeValue.charAt(0).toUpperCase()}${safeValue.slice(1)}`;
			}

			function escapeSingleQuote(value) {
				return String(value).replace(/\\/g, "\\\\").replace(/'/g, "\\'");
			}

			function formatObjectKey(value) {
				if (typeof value === "number" && Number.isFinite(value)) return String(value);
				if (/^[A-Za-z_$][\w$]*$/.test(String(value))) return String(value);
				return JSON.stringify(String(value));
			}

			function headerComment() {
				return `/*!
 * Copyright (C) Microsoft Corporation. All rights reserved.
 * This file is autogenerated. Do not edit this file directly.
 */`;
			}

			function downloadText(text, fileName, type) {
				const blob = new Blob([text], { type });
				const url = URL.createObjectURL(blob);
				const anchor = document.createElement("a");
				anchor.href = url;
				anchor.download = fileName;
				anchor.click();
				URL.revokeObjectURL(url);
			}

			function setBusy(isBusy) {
				generateButton.disabled = isBusy;
				generateButton.textContent = isBusy ? "Generating..." : "Generate Files";
			}
		</script>
	</body>
</html>
